#     auth:
#       # 腾讯云 SecretId。
#       secretId: "your-tencent-secret-id"
#       # 腾讯云 SecretKey。
#       secretKey: "your-tencent-secret-key"
#     cdn:
#       - label: "官网 CDN"
#         domain: "www.example.com"
#     edgeOne:
#       - label: "应用 EdgeOne"
#         domain: "app.example.com" # 精确 EdgeOne Host。
